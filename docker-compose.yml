services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailwizz_hygiene}
      POSTGRES_USER: ${POSTGRES_USER:-hygiene_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hygiene_user} -d ${POSTGRES_DB:-mailwizz_hygiene}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      ENABLE_MAILWIZZ_MUTATIONS: "${ENABLE_MAILWIZZ_MUTATIONS:-false}"
    volumes:
      - backups_data:/app/backups
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      ENABLE_MAILWIZZ_MUTATIONS: "${ENABLE_MAILWIZZ_MUTATIONS:-false}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'worker/index.ts' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  backups_data:
